<!doctype html>
<html>
<head>
<title>Colors</title>
<style>
.red { color: #ff0000; }
.green { color: #00ff00; }
.blue { color: #0000ff; }
.yellow { color: #ffff00; }
.cyan { color: #00ffff; }
.magenta { color: #ff00ff; }
.bg-dark { background-color: #202020; color: #ffffff; }
.named-orange { color: orange; }
</style>
</head>
<body>
<h1>Colors</h1>
<p class="red">Red text</p>
<p class="green">Green text</p>
<p class="blue">Blue text</p>
<p class="yellow">Yellow text</p>
<p class="cyan">Cyan text</p>
<p class="magenta">Magenta text</p>
<p class="named-orange">Named color: orange</p>
<div class="bg-dark">Light text on a dark background.</div>
</body>
</html>
