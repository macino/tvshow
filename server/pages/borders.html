<!doctype html>
<html>
<head>
<title>Borders</title>
<style>
.solid { border: 1px solid; padding: 1; margin: 1; }
.double { border: 1px double; padding: 1; margin: 1; }
.dashed { border: 1px dashed; padding: 1; margin: 1; }
.none { border: 1px none; padding: 1; margin: 1; }
</style>
</head>
<body>
<h1>Borders</h1>
<div class="solid">solid border</div>
<div class="double">double border</div>
<div class="dashed">dashed border</div>
<div class="none">no border</div>
</body>
</html>
