<!doctype html>
<html><head><title>Debug: Inline controls</title></head>
<body>
<h2>F2 — checkbox + label (inline sibling)</h2>
<div><input type="checkbox" name="a"> Subscribe to newsletter</div>

<h2>F3 — radio + label (inline sibling)</h2>
<div><input type="radio" name="plan" value="a"> Plan A</div>
<div><input type="radio" name="plan" value="b"> Plan B</div>

<h2>F4 — text input alone</h2>
<div><input type="text" name="x" size="20"></div>

<h2>F5 — two inputs side by side</h2>
<div><input type="text" name="a" size="10"> <input type="text" name="b" size="10"></div>

<h2>F6 — label wrapping input+text</h2>
<label><input type="checkbox" name="b"> Wrapped label</label>

<h2>F7 — checked checkbox</h2>
<div><input type="checkbox" name="c" checked> Already checked</div>

<h2>F8 — radio group (multiple)</h2>
<div>
  <div><input type="radio" name="g" value="1" checked> Option 1</div>
  <div><input type="radio" name="g" value="2"> Option 2</div>
  <div><input type="radio" name="g" value="3"> Option 3</div>
</div>
</body></html>
