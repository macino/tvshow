<!doctype html>
<html><head><title>Debug: Full forms</title></head>
<body>
<h1>All form controls</h1>

<form action="/echo" method="post">

<h2>Text inputs</h2>
<p>Text (empty): <input type="text" name="t1" size="20"></p>
<p>Text (value): <input type="text" name="t2" size="20" value="hello world"></p>
<p>Password: <input type="password" name="pw" size="20"></p>
<p>Small (size=5): <input type="text" name="t3" size="5"></p>
<p>Large (size=40): <input type="text" name="t4" size="40"></p>

<h2>Checkboxes</h2>
<p><input type="checkbox" name="c1"> Unchecked</p>
<p><input type="checkbox" name="c2" checked> Checked</p>
<p><input type="checkbox" name="c3"> Third option</p>

<h2>Radio buttons</h2>
<p><input type="radio" name="r" value="a"> Option A</p>
<p><input type="radio" name="r" value="b" checked> Option B (default)</p>
<p><input type="radio" name="r" value="c"> Option C</p>

<h2>Textarea</h2>
<p>Small (cols=20 rows=2): <textarea name="ta1" cols="20" rows="2"></textarea></p>
<p>Default (cols=40 rows=5): <textarea name="ta2"></textarea></p>

<h2>Select</h2>
<p>
  <select name="sel1">
    <option value="a">Apple</option>
    <option value="b" selected>Banana</option>
    <option value="c">Cherry</option>
  </select>
</p>

<h2>Submit buttons</h2>
<p><input type="submit" value="Submit input"></p>
<p><button type="submit">Submit button</button></p>
<p><input type="submit" value="Long label submit button"></p>

</form>

<p><a href="/pages/debug/">Back</a></p>
</body></html>
