<!doctype html>
<html>
<head>
<title>Forms</title>
<style>
.field { display: block; margin-bottom: 16px; }
.label { display: block; }
.actions { display: block; margin-top: 16px; }
</style>
</head>
<body>
<h1>Forms</h1>
<form action="/echo" method="post">
  <div class="field">
    <div class="label">Name:</div>
    <input type="text" name="name" value="">
  </div>
  <div class="field">
    <div class="label">Password:</div>
    <input type="password" name="password">
  </div>
  <div class="field">
    <div><input type="checkbox" name="subscribe" value="yes"> Subscribe to newsletter</div>
  </div>
  <div class="field">
    <div class="label">Plan:</div>
    <div><input type="radio" name="plan" value="a"> Plan A</div>
    <div><input type="radio" name="plan" value="b"> Plan B</div>
    <div><input type="radio" name="plan" value="c"> Plan C</div>
  </div>
  <div class="field">
    <div class="label">Comments:</div>
    <textarea name="comments" rows="3"></textarea>
  </div>
  <div class="field">
    <div class="label">Country:</div>
    <select name="country">
      <option value="cz">Czechia</option>
      <option value="sk">Slovakia</option>
      <option value="de">Germany</option>
      <option value="at">Austria</option>
    </select>
  </div>
  <input type="hidden" name="source" value="forms-demo">
  <div class="actions">
    <button type="submit">Submit</button>
  </div>
</form>
</body>
</html>
