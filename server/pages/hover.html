<!doctype html>
<html>
<head>
<title>Hover</title>
<style>
body { padding: 8px; }
.btn {
  display: block;
  border: solid;
  padding: 8px;
  margin-bottom: 8px;
  color: #ffffff;
  background-color: #333333;
}
.btn:hover {
  background-color: #005599;
  color: #ffff00;
}
a:hover { color: #ff0000; }
.card {
  border: solid;
  padding: 8px;
  margin-bottom: 8px;
}
.card:hover {
  background-color: #222244;
  border-color: #5555ff;
}
</style>
</head>
<body>
<h1>Hover demo</h1>
<p>Move your mouse over the elements below to see :hover styles.</p>

<h2>Buttons</h2>
<div class="btn">Hover me — background changes</div>
<div class="btn">Another button</div>

<h2>Links</h2>
<p>Visit <a href="/">the homepage</a> or <a href="/pages/layout.html">layout page</a> — links turn red on hover.</p>

<h2>Cards</h2>
<div class="card">Card one — border turns blue on hover</div>
<div class="card">Card two — same effect</div>
</body>
</html>
