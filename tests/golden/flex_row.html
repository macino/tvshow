<!doctype html>
<html>
<head>
<title>Flex Row</title>
<style>
.row { display: flex; width: 20ch; }
.a { width: 8ch; height: 2em; background-color: #222222; }
.b { flex-grow: 1; height: 2em; background-color: #444444; }
</style>
</head>
<body>
<div class="row">
  <div class="a">A</div>
  <div class="b">B</div>
</div>
</body>
</html>
